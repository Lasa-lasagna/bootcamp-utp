services:
  backend:
    build: ./backend
    env_file: local/.env
    ports:
      - "1419:1419"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:1419/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - backend
