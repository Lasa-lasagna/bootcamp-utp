spring:
  application:
    name: margos_backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[format_sql]": true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${TENANT_ID:}/v2.0

  cloud:
    azure:
      storage:
        container-name: ${AZURE_STORAGE_CONTAINER_NAME:inspecciones-fotos}
        connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}

app:
  azure:
    storage:
      connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
      container: ${AZURE_STORAGE_CONTAINER_NAME:inspecciones-fotos}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 1419

management:
  endpoints:
    web:
      exposure:
        include:
          - metrics
          - health
